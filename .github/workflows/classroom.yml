name: GitHub Classroom Workflow
on: [push]

permissions:
  checks: write
  actions: read
  contents: read
  pull-requests: read

jobs:
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "C1. Proyecto compila"
        id: c1
        continue-on-error: true
        run: make clean && make

      - name: "C2. multiplicar implementada"
        id: c2
        continue-on-error: true
        run: "! grep -q 'TODO' operaciones.c"

      - name: "C3. multiplicar devuelve resultado correcto"
        id: c3
        continue-on-error: true
        run: make clean && make && ./calculadora | grep -q '3 \* 5    = 15'

      - name: "C4. Commit wip existe"
        id: c4
        continue-on-error: true
        run: git log --all --format='%s' | grep -q 'wip'

      - name: "C5. Revert existe"
        id: c5
        continue-on-error: true
        run: git log --all --format='%s' | grep -q 'Revert'

      - name: "C6. Sin conflict markers"
        id: c6
        continue-on-error: true
        run: "! grep -q '<<<<<<<' operaciones.c"

      - name: "C7. esPar funciona"
        id: c7
        continue-on-error: true
        run: make clean && make && ./calculadora | grep -q '4 es par = 1'

      - name: "C15. P1"
        id: c15
        continue-on-error: true
        run: grep -q 'RESPUESTA_P1=b' readme.md

      - name: "C16. P2"
        id: c16
        continue-on-error: true
        run: grep -q 'RESPUESTA_P2=b' readme.md

      - name: "C17. P3"
        id: c17
        continue-on-error: true
        run: grep -q 'RESPUESTA_P3=c' readme.md

      - name: "C18. P4"
        id: c18
        continue-on-error: true
        run: grep -q 'RESPUESTA_P4=b' readme.md

      - name: "C19. P5"
        id: c19
        continue-on-error: true
        run: grep -q 'RESPUESTA_P5=c' readme.md

      - name: "C20. P6"
        id: c20
        continue-on-error: true
        run: grep -q 'RESPUESTA_P6=b' readme.md

      - name: "C21. P7"
        id: c21
        continue-on-error: true
        run: grep -q 'RESPUESTA_P7=c' readme.md

      - name: Resultado Final
        if: always()
        uses: education/autograding@v1