name: GitHub Classroom Workflow
on:
  push:
    branches: [ "**" ]

permissions:
  checks: write
  actions: read
  contents: read
  pull-requests: read

jobs:
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "C1. Proyecto compila"
        id: c1
        continue-on-error: true
        run: make clean && make

      - name: "C2. multiplicar implementada"
        id: c2
        continue-on-error: true
        run: "! grep -q 'TODO' operaciones.c"

      - name: "C3. multiplicar devuelve resultado correcto"
        id: c3
        continue-on-error: true
        run: make clean && make && ./calculadora | grep -q '3 \* 5    = 15'

      - name: "C4. Commit wip: experimento roto existe"
        id: c4
        continue-on-error: true
        run: git log --all --format='%s' | grep -qF 'wip: experimento roto'

      - name: "C5. Revert del experimento existe"
        id: c5
        continue-on-error: true
        run: git log --all --format='%s' | grep -q '^Revert'

      - name: "C9. Branch feature/mi-funcion fue creada"
        id: c9
        continue-on-error: true
        run: |
          git fetch --all --quiet
          git branch -a | grep -i 'feature/mi-funcion'

      - name: "C10. PR de feature/mi-funcion a main mergeado"
        id: c10
        continue-on-error: true
        run: |
          gh pr list --state merged --base main --json headRefName --jq '.[].headRefName' | grep -i 'feature/mi-funcion' || git log --all --oneline | grep -i "Merge pull request" | grep -i "feature/mi-funcion"

      - name: "C11. Branch sugerencia/* fue creada"
        id: c11
        continue-on-error: true
        run: |
          git fetch --all --quiet
          git branch -a | grep -i 'sugerencia'

      - name: "C15-C21. Preguntas conceptuales"
        id: teoria
        continue-on-error: true
        run: |
          grep -i 'RESPUESTA_P1=b' readme.md
          grep -i 'RESPUESTA_P2=b' readme.md

      - name: Calcular puntaje
        if: always()
        run: |
          pts() { [ "$1" = "success" ] && echo "$2" || echo 0; }
          row() { [ "$2" = "success" ] && echo "| $1 | ✅ | $3 / $3 |" || echo "| $1 | ❌ | 0 / $3 |"; }
          
          SCORE=0
          SCORE=$((SCORE + $(pts "${{ steps.c1.outcome }}" 4)))
          SCORE=$((SCORE + $(pts "${{ steps.c2.outcome }}" 4)))
          SCORE=$((SCORE + $(pts "${{ steps.c3.outcome }}" 8)))
          SCORE=$((SCORE + $(pts "${{ steps.c4.outcome }}" 8)))
          SCORE=$((SCORE + $(pts "${{ steps.c5.outcome }}" 8)))
          SCORE=$((SCORE + $(pts "${{ steps.c9.outcome }}" 4)))
          SCORE=$((SCORE + $(pts "${{ steps.c10.outcome }}" 4)))
          SCORE=$((SCORE + $(pts "${{ steps.c11.outcome }}" 4)))
          SCORE=$((SCORE + $(pts "${{ steps.teoria.outcome }}" 21)))

          {
            echo "## Puntaje Final Estimado: $SCORE / 100"
            echo ""
            echo "### Tabla de Resultados"
            echo "| Test | Estado | Puntos |"
            echo "|------|:------:|-------:|"
            row "C1. Proyecto compila" "${{ steps.c1.outcome }}" 4
            row "C2. multiplicar implementada" "${{ steps.c2.outcome }}" 4
            row "C9. Branch feature/mi-funcion" "${{ steps.c9.outcome }}" 4
            row "C15-C21. Teoria" "${{ steps.teoria.outcome }}" 21
          } >> "$GITHUB_STEP_SUMMARY"