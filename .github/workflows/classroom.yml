name: GitHub Classroom Workflow
on:
  push:
    branches: [ "**" ]

permissions:
  checks: write
  actions: read
  contents: read
  pull-requests: read

jobs:
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- EVALUACIÓN COMPLETA (C1 a C21) ---
      - name: "C1-C3"
        id: c1_3
        continue-on-error: true
        run: make clean && make && ./calculadora | grep -q '3 \* 5    = 15'
      - name: "C4-C5"
        id: c4_5
        continue-on-error: true
        run: git log --all --format='%s' | grep -qF 'wip: experimento roto' && git log --all --format='%s' | grep -q '^Revert'
      - name: "C6-C7"
        id: c6_7
        continue-on-error: true
        run: "! grep -qE '^(<<<<<<<|=======|>>>>>>>)' operaciones.c"
      - name: "C8"
        id: c8
        continue-on-error: true
        run: "! git log --format='%s' | grep -qE '^.{0,4}$'"
      - name: "C9-C10"
        id: c9_10
        continue-on-error: true
        run: git fetch --all --quiet && git branch -a | grep -i 'feature/mi-funcion'
      - name: "C11-C14"
        id: c11_14
        continue-on-error: true
        run: git fetch --all --quiet && git branch -a | grep -i 'sugerencia'
      - name: "C15-C21"
        id: teoria
        continue-on-error: true
        run: grep -qi 'RESPUESTA_P1=b' readme.md && grep -qi 'RESPUESTA_P2=b' readme.md

      # --- GENERACIÓN DE TABLA COMPLETA ---
      - name: Calcular puntaje final
        if: always()
        run: |
          # Función para sumar puntos
          val() { [ "$1" = "success" ] && echo "$2" || echo 0; }
          # Función para icono
          st() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          P_PROY=$(val "${{ steps.c1_3.outcome }}" 16)
          P_COMM=$(val "${{ steps.c4_5.outcome }}" 16)
          P_CONF=$(val "${{ steps.c6_7.outcome }}" 16)
          P_MESG=$(val "${{ steps.c8.outcome }}" 4)
          P_FEAT=$(val "${{ steps.c9_10.outcome }}" 8)
          P_SUGE=$(val "${{ steps.c11_14.outcome }}" 19)
          P_TEOR=$(val "${{ steps.teoria.outcome }}" 21)
          
          TOTAL=$((P_PROY + P_COMM + P_CONF + P_MESG + P_FEAT + P_SUGE + P_TEOR))

          echo "## 📊 Puntaje Total: $TOTAL / 100" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Estado | Puntos |" >> $GITHUB_STEP_SUMMARY
          echo "|------|:------:|-------:|" >> $GITHUB_STEP_SUMMARY
          echo "| C1-C3. Compilación y Lógica | $(st "${{ steps.c1_3.outcome }}") | $P_PROY |" >> $GITHUB_STEP_SUMMARY
          echo "| C4-C5. WIP y Revert | $(st "${{ steps.c4_5.outcome }}") | $P_COMM |" >> $GITHUB_STEP_SUMMARY
          echo "| C6-C7. Conflictos y esPar | $(st "${{ steps.c6_7.outcome }}") | $P_CONF |" >> $GITHUB_STEP_SUMMARY
          echo "| C8. Mensajes de Commit | $(st "${{ steps.c8.outcome }}") | $P_MESG |" >> $GITHUB_STEP_SUMMARY
          echo "| C9-C10. Rama Feature y Merge | $(st "${{ steps.c9_10.outcome }}") | $P_FEAT |" >> $GITHUB_STEP_SUMMARY
          echo "| C11-C14. Rama Sugerencia y Review | $(st "${{ steps.c11_14.outcome }}") | $P_SUGE |" >> $GITHUB_STEP_SUMMARY
          echo "| C15-C21. Preguntas Teóricas | $(st "${{ steps.teoria.outcome }}") | $P_TEOR |" >> $GITHUB_STEP_SUMMARY