name: GitHub Classroom Workflow
on:
  push:
    branches: [ "**" ]

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "C1. Proyecto compila"
        id: c1
        continue-on-error: true
        run: make clean && make

      - name: "C2. multiplicar implementada"
        id: c2
        continue-on-error: true
        run: "! grep -q 'TODO' operaciones.c"

      - name: "C9. Branch feature/mi-funcion"
        id: c9
        continue-on-error: true
        run: git fetch --all --quiet && git branch -a | grep -i 'feature/mi-funcion'

      - name: "C11. Branch sugerencia"
        id: c11
        continue-on-error: true
        run: git fetch --all --quiet && git branch -a | grep -i 'sugerencia'

      - name: "Teoria"
        id: teoria
        continue-on-error: true
        run: grep -i 'RESPUESTA_P1=b' readme.md

      - name: Generar Tabla de Puntos
        if: always()
        run: |
          pts() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          
          echo "## 📊 Resumen de Corrección" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|------|:------:|" >> $GITHUB_STEP_SUMMARY
          echo "| C1. Compilación | $(pts "${{ steps.c1.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| C2. Multiplicar | $(pts "${{ steps.c2.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| C9. Rama Feature | $(pts "${{ steps.c9.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| C11. Rama Sugerencia | $(pts "${{ steps.c11.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Teoria (Readme) | $(pts "${{ steps.teoria.outcome }}") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ¡Si ves tildes verdes, tu puntaje ya subió!" >> $GITHUB_STEP_SUMMARY