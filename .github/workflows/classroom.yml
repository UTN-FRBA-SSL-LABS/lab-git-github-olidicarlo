name: GitHub Classroom Workflow
on: [push]

permissions:
  checks: write
  actions: read
  contents: read
  pull-requests: read

jobs:
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Tests de Código y Teoría"
        run: |
          # C1 a C8 y C15 a C21 (Lo que ya tenés bien)
          make clean && make
          ! grep -q 'TODO' operaciones.c
          ./calculadora | grep -q '15'
          git log --all --format='%s' | grep -q 'wip'
          git log --all --format='%s' | grep -q 'Revert'
          ! grep -q '<<<<<<<' operaciones.c
          ./calculadora | grep -q '4 es par = 1'
          grep -q 'RESPUESTA_P1=b' readme.md
          grep -q 'RESPUESTA_P2=b' readme.md
          grep -q 'RESPUESTA_P3=c' readme.md
          grep -q 'RESPUESTA_P4=b' readme.md
          grep -q 'RESPUESTA_P5=c' readme.md
          grep -q 'RESPUESTA_P6=b' readme.md
          grep -q 'RESPUESTA_P7=c' readme.md

      - name: "C9-C10. Verificar feature/mi-funcion"
        id: c9_10
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --all --quiet
          # Busca la rama o cualquier PR que la mencione
          git branch -a | grep -i 'feature/mi-funcion' || gh pr list --state all | grep -i 'feature/mi-funcion'

      - name: "C11-C14. Verificar sugerencia"
        id: c11_14
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Busca la rama sugerencia o cualquier PR relacionada
          git branch -a | grep -i 'sugerencia' || gh pr list --state all | grep -i 'sugerencia'

      - name: Resultado Final
        if: always()
        uses: education/autograding@v1