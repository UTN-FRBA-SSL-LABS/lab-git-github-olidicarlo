name: GitHub Classroom Workflow
on: [push]

permissions:
  checks: write
  actions: read
  contents: read
  pull-requests: read

jobs:
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Ejecutar Tests de Autograding"
        id: tests
        continue-on-error: true
        run: |
          # FORZAMOS EL TOKEN (La solución de GitHub)
          export GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          
          # C1-C8: Código y Commits
          make clean && make
          ! grep -q 'TODO' operaciones.c
          ./calculadora | grep -q '15'
          git log --all --format='%s' | grep -q 'wip'
          git log --all --format='%s' | grep -q 'Revert'
          ! grep -q '<<<<<<<' operaciones.c
          ./calculadora | grep -q '4 es par = 1'
          ! git log --format='%s' | grep -qE '^.{0,4}$'
          
          # C9-C14: PRs y Ramas (Ahora con permiso)
          git fetch --all --quiet
          gh pr list --state all | grep -i 'feature/mi-funcion' || git branch -a | grep -i 'feature/mi-funcion'
          gh pr list --state all | grep -i 'sugerencia' || git branch -a | grep -i 'sugerencia'
          
          # C15-C21: Teoría
          grep -i 'RESPUESTA_P1=b' readme.md
          grep -i 'RESPUESTA_P2=b' readme.md
          grep -i 'RESPUESTA_P3=c' readme.md
          grep -i 'RESPUESTA_P4=b' readme.md
          grep -i 'RESPUESTA_P5=c' readme.md
          grep -i 'RESPUESTA_P6=b' readme.md
          grep -i 'RESPUESTA_P7=c' readme.md

      - name: Resultado Final
        if: always()
        uses: education/autograding@v1